databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: relay-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REPLAY_MODE
        value: "false"
