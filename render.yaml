databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: relay-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mock_server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: REPLAY_MODE
        value: "true"

  - type: web
    name: relay-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: relay-api
          envVarKey: RENDER_EXTERNAL_URL
